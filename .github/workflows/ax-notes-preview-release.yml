name: Build and publish AX Notes isolated test preview

on:
  push:
    branches: [release/ax-notes-preview-20261024]

permissions:
  contents: read

concurrency:
  group: ax-notes-preview-20261024
  cancel-in-progress: false

env:
  SOURCE_SHA: 116d0b3b42b66e89dd02d8578b9c4d5623248afe
  RELEASE_TAG: ax-notes-preview-20261024

jobs:
  build:
    if: github.repository == 'msaltnet/ax-notes' && github.ref == 'refs/heads/release/ax-notes-preview-20261024'
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: 116d0b3b42b66e89dd02d8578b9c4d5623248afe
          persist-credentials: false
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Verify source and install Android build components
        run: |
          test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" 'platforms;android-35' 'build-tools;35.0.0'
      - name: Verify tokens and Python tests
        run: |
          python3 scripts/export-design-tokens.py --check
          python3 -m unittest discover -s scripts -p 'test_*.py'
      - name: Run complete Android unit and UI tests
        run: bash gradlew --no-daemon --no-parallel --max-workers=2 -PaxPreview=true testDebugUnitTest
      - name: Run lint and build test APKs
        run: bash gradlew --no-daemon --no-parallel --max-workers=2 -PaxPreview=true lintDebug assembleDebug assembleDebugAndroidTest compileReleaseKotlin
      - name: Verify side-by-side identity, signature and checksums
        run: |
          mkdir dist
          cp app/build/outputs/apk/debug/app-debug.apk dist/AX-Notes-0.3.0-preview-20261024.apk
          APK=dist/AX-Notes-0.3.0-preview-20261024.apk
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging "$APK" > dist/APK-IDENTITY.txt
          grep -F "package: name='net.msalt.axnotes.preview20261024' versionCode='4' versionName='0.3.0-preview.20261024'" dist/APK-IDENTITY.txt
          grep -F "application-label:'AX Notes Preview 10-24'" dist/APK-IDENTITY.txt
          printf 'Source commit: %s\nWorkflow commit: %s\nRun: https://github.com/%s/actions/runs/%s\n' "$SOURCE_SHA" "$GITHUB_SHA" "$GITHUB_REPOSITORY" "$GITHUB_RUN_ID" > dist/BUILD-INFO.txt
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose --print-certs "$APK" >> dist/BUILD-INFO.txt
          cp docs/releases/preview-20261024.md dist/RELEASE-NOTES.md
          (cd dist && sha256sum AX-Notes-0.3.0-preview-20261024.apk BUILD-INFO.txt APK-IDENTITY.txt RELEASE-NOTES.md > SHA256SUMS)
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ax-notes-preview-20261024
          path: dist/
          if-no-files-found: error
          retention-days: 7

  publish:
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: ax-notes-preview-20261024
          path: dist
      - name: Verify artifact and create test prerelease
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          (cd dist && sha256sum -c SHA256SUMS)
          grep -Fx "Source commit: $SOURCE_SHA" dist/BUILD-INFO.txt
          grep -Fx "Workflow commit: $GITHUB_SHA" dist/BUILD-INFO.txt
          # Atomic create fails if the tag already exists; never move or reuse it.
          gh api --method POST "repos/$GITHUB_REPOSITORY/git/refs" \
            -f "ref=refs/tags/$RELEASE_TAG" -f "sha=$SOURCE_SHA" --silent
          test "$(gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$RELEASE_TAG" --jq '.object.sha')" = "$SOURCE_SHA"
          gh release create "$RELEASE_TAG" \
            dist/AX-Notes-0.3.0-preview-20261024.apk dist/SHA256SUMS dist/BUILD-INFO.txt dist/APK-IDENTITY.txt dist/RELEASE-NOTES.md \
            --repo "$GITHUB_REPOSITORY" --target "$SOURCE_SHA" --verify-tag \
            --title 'AX Notes Test Preview (2026-10-24)' --prerelease --latest=false \
            --notes-file dist/RELEASE-NOTES.md
